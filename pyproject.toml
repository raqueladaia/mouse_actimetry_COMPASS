[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "compass-analysis"
version = "0.1.0"
description = "Analysis toolkit for COMPASS actimeter home-cage activity data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
gui = [
    "PyQt6>=6.5",
]

[tool.setuptools.packages.find]
include = ["compass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
